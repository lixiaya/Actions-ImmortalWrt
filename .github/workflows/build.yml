name: 🚀 编译 (Build)

on:
  workflow_dispatch:
    inputs:
      owner:
        description: "ImmortalWrt 仓库的拥有者 (Owner of ImmortalWrt repo)"
        type: string
        required: true
        default: "immortalwrt"
      repo:
        description: "ImmortalWrt 仓库的名字 (Name of ImmortalWrt repo)"
        type: string
        required: true
        default: "immortalwrt"
      branch:
        description: "ImmortalWrt 仓库的分支 (Branch of ImmortalWrt repo)"
        type: string
        required: true
        default: "openwrt-25.12"
      multithreading:
        description: "开启多线程编译 (Enable multithreading build)"
        type: boolean
        default: true
      ssh:
        description: "使用 ssh 连接到编译环境 (Connect to the build environment using ssh)"
        type: boolean
        default: false
      quick_test:
        description: "快速验证：只编译到 mt76 就停 (Quick test: stop after mt76)"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M
  CCACHE_COMPILERCHECK: content
  CCACHE_NOHASHDIR: true
  CCACHE_HARDLINK: true

jobs:
  quick-test:
    if: ${{inputs.quick_test == true}}
    runs-on: ubuntu-latest
    name: ⚡ 快速验证 (Quick Test - stop at mt76)
    steps:
      - name: 🔧 恢复 ccache 缓存 (Restore ccache)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('ImmortalWrt/.config', 'ImmortalWrt/feeds.conf.default') }}
          restore-keys: ccache-${{ runner.os }}-

      - name: 🔧 恢复编译缓存 (Restore build cache)
        uses: actions/cache@v4
        with:
          path: |
            ImmortalWrt/build_dir
            ImmortalWrt/staging_dir
          key: build-${{ runner.os }}-${{ hashFiles('ImmortalWrt/.config', 'ImmortalWrt/feeds.conf.default') }}
          restore-keys: build-${{ runner.os }}-

      - name: 下载编译所需的依赖 (Install deps)
        run: |
          sudo apt update
          sudo apt install -y ccache

      - name: 克隆当前仓库 (Clone current repo)
        uses: actions/checkout@v4

      - name: 克隆 ImmortalWrt 仓库 (Clone ImmortalWrt repo)
        uses: actions/checkout@v4
        with:
          repository: "${{inputs.owner}}/${{inputs.repo}}"
          ref: ${{inputs.branch}}
          path: ImmortalWrt

      - name: 复制配置文件 (Copy config)
        run: cp -f .config feeds.conf.default diy.sh ImmortalWrt/

      - name: 更新并安装 feeds (Update & install feeds)
        working-directory: ImmortalWrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 修复 mac80211 allnoconfig 问题 (Fix mac80211 allnoconfig)
        working-directory: ImmortalWrt
        run: |
          rm -f package/kernel/mac80211/patches/build/002-change_allconfig.patch
          echo "Removed 002-change_allconfig.patch"

      - name: 再次复制配置文件 (Copy config again)
        run: cp -f .config feeds.conf.default diy.sh ImmortalWrt/

      - name: 生成配置 (Generate config)
        working-directory: ImmortalWrt
        run: make defconfig

      - name: 下载源码 (Download sources)
        working-directory: ImmortalWrt
        run: make download -j$(nproc)

      - name: 编译 tools (Build tools)
        working-directory: ImmortalWrt
        run: make tools/install -j$(nproc) V=s

      - name: 编译 toolchain (Build toolchain)
        working-directory: ImmortalWrt
        run: make toolchain/install -j$(nproc) V=s

      - name: 准备内核源码 (Prepare kernel source)
        working-directory: ImmortalWrt
        run: make target/linux/prepare V=s

      - name: 编译并安装 mac80211 (Build & install mac80211)
        working-directory: ImmortalWrt
        run: |
          make package/kernel/mac80211/compile V=s
          make package/kernel/mac80211/install V=s

      - name: 检查 autoconf.h 是否存在 (Check autoconf.h)
        working-directory: ImmortalWrt
        run: |
          echo "=== Checking autoconf.h in build_dir ==="
          find build_dir -name "autoconf.h" 2>/dev/null | head -5 || echo "autoconf.h NOT FOUND in build_dir"
          echo "=== Checking autoconf.h in staging_dir ==="
          find staging_dir -name "autoconf.h" 2>/dev/null | head -5 || echo "autoconf.h NOT FOUND in staging_dir"
          echo "=== Checking mac80211-backport ==="
          ls -la staging_dir/target-*/usr/include/mac80211-backport/backport/ 2>/dev/null || echo "mac80211-backport not found"

      - name: 编译 mt76 (Build mt76)
        working-directory: ImmortalWrt
        run: make package/kernel/mt76/compile V=s

      - name: ✅ 快速验证通过 (Quick test passed)
        run: echo "Quick test passed! mt76 compiled successfully."

  build:
    if: ${{inputs.ssh == false}}
    runs-on: ubuntu-latest
    name: 🚀 编译 (Build)
    steps:
      - name: 🔧 恢复 ccache 缓存 (Restore ccache)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('ImmortalWrt/.config', 'ImmortalWrt/feeds.conf.default') }}
          restore-keys: ccache-${{ runner.os }}-

      - name: 🔧 恢复编译缓存 (Restore build cache)
        uses: actions/cache@v4
        with:
          path: |
            ImmortalWrt/build_dir
            ImmortalWrt/staging_dir
          key: build-${{ runner.os }}-${{ hashFiles('ImmortalWrt/.config', 'ImmortalWrt/feeds.conf.default') }}
          restore-keys: build-${{ runner.os }}-

      - name: 下载编译所需的依赖 (Install the software packages required for compilation)
        run: |
          sudo apt update
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler dwarves ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-docutils python3-pip python3-ply python3-pyelftools python3-setuptools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: 克隆当前仓库 (Clone current repo)
        uses: actions/checkout@v4

      - name: 克隆 ImmortalWrt 仓库 (Clone ImmortalWrt repo)
        uses: actions/checkout@v4
        with:
          repository: "${{inputs.owner}}/${{inputs.repo}}"
          ref: ${{inputs.branch}}
          path: ImmortalWrt

      - name: 复制当前仓库的配置文件到 ImmortalWrt 仓库  (Copy current repo config to ImmortalWrt repo)
        run: cp -f .config feeds.conf.default diy.sh ImmortalWrt/

      - name: 更新并下载 feeds (Update and download feeds)
        working-directory: ImmortalWrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 修复 mac80211 allnoconfig 问题 (Fix mac80211 allnoconfig issue)
        working-directory: ImmortalWrt
        run: |
          # 删除有问题的 patch，该 patch 将 allnoconfig 改为纯全关闭模式
          # 导致 backport/autoconf.h 无法生成，mt76 编译失败
          rm -f package/kernel/mac80211/patches/build/002-change_allconfig.patch
          echo "Removed 002-change_allconfig.patch"

      - name: 再次复制当前仓库的配置文件到 ImmortalWrt 仓库 (Copy current repo config to ImmortalWrt repo again)
        run: cp -f .config feeds.conf.default diy.sh ImmortalWrt/

      - name: 生成完整配置并检查 BTF (Generate full config and check BTF)
        working-directory: ImmortalWrt
        run: |
          set -x
          make defconfig
          echo 'CONFIG_CCACHE=y' >> .config
          make defconfig
          echo '==== Kernel/BTF config after defconfig ===='
          grep -E 'CONFIG_LINUX_6_12|CONFIG_KERNEL_DEBUG_INFO|CONFIG_KERNEL_DEBUG_INFO_BTF|CONFIG_KERNEL_BPF_SYSCALL|CONFIG_KERNEL_BPF_JIT|CONFIG_KERNEL_BPF|CONFIG_PACKAGE_kmod-sched-bpf|CONFIG_PACKAGE_kmod-bpf|CONFIG_PACKAGE_apk|CONFIG_PACKAGE_opkg|CONFIG_PACKAGE_daed|CONFIG_PACKAGE_luci-app-daed' .config || true
          grep -q '^CONFIG_LINUX_6_12=y$' .config || { echo 'CONFIG_LINUX_6_12 was not enabled after defconfig'; exit 1; }
          grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y$' .config || { echo 'CONFIG_KERNEL_DEBUG_INFO_BTF was not enabled after defconfig'; exit 1; }
          grep -q '^CONFIG_KERNEL_DEBUG_INFO=y$' .config || { echo 'CONFIG_KERNEL_DEBUG_INFO was not enabled after defconfig'; exit 1; }
          grep -Eq '^CONFIG_PACKAGE_apk(-(openssl|mbedtls))?=y$' .config || { echo 'No apk package manager was enabled after defconfig'; exit 1; }
          grep -q '^CONFIG_PACKAGE_daed=y$' .config || { echo 'CONFIG_PACKAGE_daed was not enabled after defconfig'; exit 1; }
          grep -q '^CONFIG_PACKAGE_luci-app-daed=y$' .config || { echo 'CONFIG_PACKAGE_luci-app-daed was not enabled after defconfig'; exit 1; }
          grep -q '^CONFIG_KERNEL_BPF_SYSCALL=y$' .config || echo 'CONFIG_KERNEL_BPF_SYSCALL was not enabled after defconfig'
          grep -q '^CONFIG_KERNEL_BPF_JIT=y$' .config || echo 'CONFIG_KERNEL_BPF_JIT was not enabled after defconfig'
          pahole --version

      - name: 编译前上传配置 (Upload config before build)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-before-build
          path: |
            ImmortalWrt/feeds.conf.default
            ImmortalWrt/.config

      - name: 下载编译 (Download build)
        working-directory: ImmortalWrt
        run: make download -j$(nproc)

      - name: 修复 host 工具缺失 (Fix missing host tools)
        working-directory: ImmortalWrt
        run: |
          mkdir -p staging_dir/host/bin
          # lua host 编译需要 sed 在 staging_dir/host/bin/sed
          ln -sf $(which sed) staging_dir/host/bin/sed 2>/dev/null || true
          ln -sf $(which awk) staging_dir/host/bin/awk 2>/dev/null || true
          ln -sf $(which grep) staging_dir/host/bin/grep 2>/dev/null || true
          echo "=== host tools check ==="
          ls -la staging_dir/host/bin/ || true

      - name: 准备内核源码 (Prepare kernel source)
        working-directory: ImmortalWrt
        run: make target/linux/prepare V=s

      - name: 编译并安装 mac80211 (Build & install mac80211)
        working-directory: ImmortalWrt
        run: |
          make package/kernel/mac80211/compile V=s
          make package/kernel/mac80211/install V=s

      - name: 检查 backport 头文件 (Check backport headers)
        working-directory: ImmortalWrt
        run: |
          echo "=== Checking backport headers ==="
          ls -la staging_dir/target-*/usr/include/mac80211-backport/backport/ 2>/dev/null || echo "mac80211-backport not found"
          find staging_dir -name "autoconf.h" 2>/dev/null | head -5 || echo "autoconf.h NOT FOUND"

      - name: 多线程编译 ImmortalWrt (Build ImmortalWrt multithreading)
        if: ${{inputs.multithreading == true}}
        working-directory: ImmortalWrt
        run: make -j$(nproc) V=s || (make package/kernel/mt76/clean package/kernel/mac80211/clean V=s && make -j1 V=s)

      - name: 单线程编译 ImmortalWrt (Build ImmortalWrt single thread)
        if: ${{inputs.multithreading == false}}
        working-directory: ImmortalWrt
        run: make -j1 V=s

      - name: 上传编译结果到 Artifact (Upload build result to Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-build-result
          path: ImmortalWrt/bin/targets

      - name: 显示 ccache 统计 (Show ccache statistics)
        run: |
          ccache -s
          echo "=== ccache directory ==="
          du -sh ~/.ccache || true

  build-ssh:
    if: ${{inputs.ssh == true}}
    name: 🚀 编译 (Build) - SSH
    runs-on: ubuntu-latest
    steps:
      - name: 🔧 恢复 ccache 缓存 (Restore ccache)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('ImmortalWrt/.config', 'ImmortalWrt/feeds.conf.default') }}
          restore-keys: ccache-${{ runner.os }}-

      - name: 🔧 恢复编译缓存 (Restore build cache)
        uses: actions/cache@v4
        with:
          path: |
            ImmortalWrt/build_dir
            ImmortalWrt/staging_dir
          key: build-${{ runner.os }}-${{ hashFiles('ImmortalWrt/.config', 'ImmortalWrt/feeds.conf.default') }}
          restore-keys: build-${{ runner.os }}-

      - name: 下载编译所需的依赖 (Install the software packages required for compilation)
        run: |
          sudo apt update
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler dwarves ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-docutils python3-pip python3-ply python3-pyelftools python3-setuptools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: 克隆当前仓库 (Clone current repo)
        uses: actions/checkout@v4

      - name: 克隆 ImmortalWrt 仓库 (Clone ImmortalWrt repo)
        uses: actions/checkout@v4
        with:
          repository: "${{inputs.owner}}/${{inputs.repo}}"
          ref: ${{inputs.branch}}
          path: ImmortalWrt

      - name: 复制当前仓库的配置文件到 ImmortalWrt 仓库  (Copy current repo config to ImmortalWrt repo)
        run: cp -f .config feeds.conf.default diy.sh ImmortalWrt/

      - name: 更新并下载 feeds (Update and download feeds)
        working-directory: ImmortalWrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 修复 mac80211 allnoconfig 问题 (Fix mac80211 allnoconfig issue)
        working-directory: ImmortalWrt
        run: |
          # 删除有问题的 patch，该 patch 将 allnoconfig 改为纯全关闭模式
          # 导致 backport/autoconf.h 无法生成，mt76 编译失败
          rm -f package/kernel/mac80211/patches/build/002-change_allconfig.patch
          echo "Removed 002-change_allconfig.patch"

      - name: 再次复制当前仓库的配置文件到 ImmortalWrt 仓库 (Copy current repo config to ImmortalWrt repo again)
        run: cp -f .config feeds.conf.default diy.sh ImmortalWrt/

      - name: 生成完整配置并检查 BTF (Generate full config and check BTF)
        working-directory: ImmortalWrt
        run: |
          set -x
          make defconfig
          echo 'CONFIG_CCACHE=y' >> .config
          make defconfig
          echo '==== Kernel/BTF config after defconfig ===='
          grep -E 'CONFIG_LINUX_6_12|CONFIG_KERNEL_DEBUG_INFO|CONFIG_KERNEL_DEBUG_INFO_BTF|CONFIG_KERNEL_BPF_SYSCALL|CONFIG_KERNEL_BPF_JIT|CONFIG_KERNEL_BPF|CONFIG_PACKAGE_kmod-sched-bpf|CONFIG_PACKAGE_kmod-bpf|CONFIG_PACKAGE_apk|CONFIG_PACKAGE_opkg|CONFIG_PACKAGE_daed|CONFIG_PACKAGE_luci-app-daed' .config || true
          grep -q '^CONFIG_LINUX_6_12=y$' .config || { echo 'CONFIG_LINUX_6_12 was not enabled after defconfig'; exit 1; }
          grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y$' .config || { echo 'CONFIG_KERNEL_DEBUG_INFO_BTF was not enabled after defconfig'; exit 1; }
          grep -q '^CONFIG_KERNEL_DEBUG_INFO=y$' .config || { echo 'CONFIG_KERNEL_DEBUG_INFO was not enabled after defconfig'; exit 1; }
          grep -Eq '^CONFIG_PACKAGE_apk(-(openssl|mbedtls))?=y$' .config || { echo 'No apk package manager was enabled after defconfig'; exit 1; }
          grep -q '^CONFIG_PACKAGE_daed=y$' .config || { echo 'CONFIG_PACKAGE_daed was not enabled after defconfig'; exit 1; }
          grep -q '^CONFIG_PACKAGE_luci-app-daed=y$' .config || { echo 'CONFIG_PACKAGE_luci-app-daed was not enabled after defconfig'; exit 1; }
          grep -q '^CONFIG_KERNEL_BPF_SYSCALL=y$' .config || echo 'CONFIG_KERNEL_BPF_SYSCALL was not enabled after defconfig'
          grep -q '^CONFIG_KERNEL_BPF_JIT=y$' .config || echo 'CONFIG_KERNEL_BPF_JIT was not enabled after defconfig'
          pahole --version

      - name: 开启 SSH 服务 (Start SSH service)
        uses: lhotari/action-upterm@v1
        continue-on-error: true
        with:
          wait-timeout-minutes: 20

      #      # 你也可以使用这个，个人觉得它更好用 (You can use this, I personally think it is better)
      #      - name: 开启 SSH 服务 (Start SSH service)
      #        uses: mxschmitt/action-tmate@v3
      #        timeout-minutes: 15

      - name: 编译前上传配置 (Upload config before build)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-before-build
          path: |
            ImmortalWrt/feeds.conf.default
            ImmortalWrt/.config

      - name: 下载编译 (Download build)
        working-directory: ImmortalWrt
        run: make download -j$(nproc)

      - name: 多线程编译 ImmortalWrt (Build ImmortalWrt multithreading)
        if: ${{inputs.multithreading == true}}
        working-directory: ImmortalWrt
        run: make -j$(nproc) V=s || (make package/kernel/mt76/clean package/kernel/mac80211/clean V=s && make -j1 V=s)

      - name: 单线程编译 ImmortalWrt (Build ImmortalWrt single thread)
        if: ${{inputs.multithreading == false}}
        working-directory: ImmortalWrt
        run: make -j1 V=s

      - name: 上传编译结果到 Artifact (Upload build result to Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-build-result
          path: ImmortalWrt/bin/targets
