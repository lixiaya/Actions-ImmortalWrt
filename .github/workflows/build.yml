name: 🚀 编译 (Build)

on:
  workflow_dispatch:
    inputs:
      owner:
        description: "ImmortalWrt 仓库的拥有者 (Owner of ImmortalWrt repo)"
        type: string
        required: true
        default: "immortalwrt"
      repo:
        description: "ImmortalWrt 仓库的名字 (Name of ImmortalWrt repo)"
        type: string
        required: true
        default: "immortalwrt"
      branch:
        description: "ImmortalWrt 仓库的分支 (Branch of ImmortalWrt repo)"
        type: string
        required: true
        default: "openwrt-25.12"
      multithreading:
        description: "开启多线程编译 (Enable multithreading build)"
        type: boolean
        default: true
      ssh:
        description: "使用 ssh 连接到编译环境 (Connect to the build environment using ssh)"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    if: ${{inputs.ssh == false}}
    runs-on: ubuntu-latest
    name: 🚀 编译 (Build)
    steps:
      - name: 下载编译所需的依赖 (Install the software packages required for compilation)
        run: |
          sudo apt update
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler dwarves ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-docutils python3-pip python3-ply python3-pyelftools python3-setuptools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: 克隆当前仓库 (Clone current repo)
        uses: actions/checkout@v4

      - name: 克隆 ImmortalWrt 仓库 (Clone ImmortalWrt repo)
        uses: actions/checkout@v4
        with:
          repository: "${{inputs.owner}}/${{inputs.repo}}"
          ref: ${{inputs.branch}}
          path: ImmortalWrt

      - name: 复制当前仓库的配置文件到 ImmortalWrt 仓库  (Copy current repo config to ImmortalWrt repo)
        run: cp -f .config feeds.conf.default diy.sh ImmortalWrt/

      - name: 运行 diy.sh (Run diy.sh)
        working-directory: ImmortalWrt
        run: |
          chmod +x diy.sh
          ./diy.sh

      - name: 更新并下载 feeds (Update and download feeds)
        working-directory: ImmortalWrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 再次复制当前仓库的配置文件到 ImmortalWrt 仓库 (Copy current repo config to ImmortalWrt repo again)
        run: cp -f .config feeds.conf.default diy.sh ImmortalWrt/

      - name: 生成完整配置并检查 BTF (Generate full config and check BTF)
        working-directory: ImmortalWrt
        run: |
          set -x
          make defconfig
          echo '==== Kernel/BTF config after defconfig ===='
          grep -E 'CONFIG_LINUX_6_12|CONFIG_KERNEL_DEBUG_INFO|CONFIG_KERNEL_DEBUG_INFO_BTF|CONFIG_KERNEL_BPF_SYSCALL|CONFIG_KERNEL_BPF_JIT|CONFIG_KERNEL_BPF|CONFIG_PACKAGE_kmod-sched-bpf|CONFIG_PACKAGE_kmod-bpf|CONFIG_PACKAGE_apk|CONFIG_PACKAGE_opkg|CONFIG_PACKAGE_daed|CONFIG_PACKAGE_luci-app-daed' .config || true
          grep -q '^CONFIG_LINUX_6_12=y$' .config || { echo 'CONFIG_LINUX_6_12 was not enabled after defconfig'; exit 1; }
          grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y$' .config || { echo 'CONFIG_KERNEL_DEBUG_INFO_BTF was not enabled after defconfig'; exit 1; }
          grep -q '^CONFIG_KERNEL_DEBUG_INFO=y$' .config || { echo 'CONFIG_KERNEL_DEBUG_INFO was not enabled after defconfig'; exit 1; }
          grep -Eq '^CONFIG_PACKAGE_apk(-(openssl|mbedtls))?=y$' .config || { echo 'No apk package manager was enabled after defconfig'; exit 1; }
          grep -q '^CONFIG_PACKAGE_daed=y$' .config || { echo 'CONFIG_PACKAGE_daed was not enabled after defconfig'; exit 1; }
          grep -q '^CONFIG_PACKAGE_luci-app-daed=y$' .config || { echo 'CONFIG_PACKAGE_luci-app-daed was not enabled after defconfig'; exit 1; }
          grep -q '^CONFIG_KERNEL_BPF_SYSCALL=y$' .config || echo 'CONFIG_KERNEL_BPF_SYSCALL was not enabled after defconfig'
          grep -q '^CONFIG_KERNEL_BPF_JIT=y$' .config || echo 'CONFIG_KERNEL_BPF_JIT was not enabled after defconfig'
          pahole --version

      - name: 编译前上传配置 (Upload config before build)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-before-build
          path: |
            ImmortalWrt/feeds.conf.default
            ImmortalWrt/.config

      - name: 构建 host 工具链 (Build host tools and toolchain)
        working-directory: ImmortalWrt
        run: |
          make tools/install -j$(nproc) V=s
          make toolchain/install -j$(nproc) V=s

      - name: 多线程编译 ImmortalWrt (Build ImmortalWrt multithreading)
        if: ${{inputs.multithreading == true}}
        working-directory: ImmortalWrt
        run: make -j$(nproc) V=s || (make package/kernel/mt76/clean package/kernel/mac80211/clean V=s && make -j1 V=s)

      - name: 单线程编译 ImmortalWrt (Build ImmortalWrt single thread)
        if: ${{inputs.multithreading == false}}
        working-directory: ImmortalWrt
        run: make -j1 V=s

      - name: 上传编译结果到 Artifact (Upload build result to Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-build-result
          path: ImmortalWrt/bin/targets

  build-ssh:
    if: ${{inputs.ssh == true}}
    name: 🚀 编译 (Build) - SSH
    runs-on: ubuntu-latest
    steps:
      - name: 下载编译所需的依赖 (Install the software packages required for compilation)
