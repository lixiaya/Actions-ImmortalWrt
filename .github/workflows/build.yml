      - name: 复制当前仓库的配置文件到 ImmortalWrt 仓库  (Copy current repo config to ImmortalWrt repo)
        run: cp -f .config feeds.conf.default diy.sh ImmortalWrt/

      - name: 运行 diy.sh (Run diy.sh)
        working-directory: ImmortalWrt
        run: |
          chmod +x diy.sh
          ./diy.sh

      - name: 更新并下载 feeds (Update and download feeds)
        working-directory: ImmortalWrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 再次复制当前仓库的配置文件到 ImmortalWrt 仓库 (Copy current repo config to ImmortalWrt repo again)
        run: cp -f .config feeds.conf.default diy.sh ImmortalWrt/

      - name: 生成完整配置并检查 BTF (Generate full config and check BTF)
        working-directory: ImmortalWrt
        run: |
          set -x
          make defconfig
          echo '==== Kernel/BTF config after defconfig ===='
          grep -E 'CONFIG_LINUX_6_12|CONFIG_KERNEL_DEBUG_INFO|CONFIG_KERNEL_DEBUG_INFO_BTF|CONFIG_KERNEL_BPF_SYSCALL|CONFIG_KERNEL_BPF_JIT|CONFIG_KERNEL_BPF|CONFIG_PACKAGE_kmod-sched-bpf|CONFIG_PACKAGE_kmod-bpf|CONFIG_PACKAGE_apk|CONFIG_PACKAGE_opkg|CONFIG_PACKAGE_daed|CONFIG_PACKAGE_luci-app-daed' .config || true
          grep -q '^CONFIG_LINUX_6_12=y$' .config || { echo 'CONFIG_LINUX_6_12 was not enabled after defconfig'; exit 1; }
          grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y$' .config || { echo 'CONFIG_KERNEL_DEBUG_INFO_BTF was not enabled after defconfig'; exit 1; }
          grep -q '^CONFIG_KERNEL_DEBUG_INFO=y$' .config || { echo 'CONFIG_KERNEL_DEBUG_INFO was not enabled after defconfig'; exit 1; }
          grep -Eq '^CONFIG_PACKAGE_apk(-(openssl|mbedtls))?=y$' .config || { echo 'No apk package manager was enabled after defconfig'; exit 1; }
          grep -q '^CONFIG_PACKAGE_daed=y$' .config || { echo 'CONFIG_PACKAGE_daed was not enabled after defconfig'; exit 1; }
          grep -q '^CONFIG_PACKAGE_luci-app-daed=y$' .config || { echo 'CONFIG_PACKAGE_luci-app-daed was not enabled after defconfig'; exit 1; }
          grep -q '^CONFIG_KERNEL_BPF_SYSCALL=y$' .config || echo 'CONFIG_KERNEL_BPF_SYSCALL was not enabled after defconfig'
          grep -q '^CONFIG_KERNEL_BPF_JIT=y$' .config || echo 'CONFIG_KERNEL_BPF_JIT was not enabled after defconfig'
          pahole --version

      - name: 开启 SSH 服务 (Start SSH service)
        uses: lhotari/action-upterm@v1
        continue-on-error: true
        with:
          wait-timeout-minutes: 20

      #      # 你也可以使用这个，个人觉得它更好用 (You can use this, I personally think it is better)
      #      - name: 开启 SSH 服务 (Start SSH service)
      #        uses: mxschmitt/action-tmate@v3
      #        timeout-minutes: 15

      - name: 编译前上传配置 (Upload config before build)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-before-build
          path: |
            ImmortalWrt/feeds.conf.default
            ImmortalWrt/.config

      - name: 构建 host 工具链 (Build host tools and toolchain)
        working-directory: ImmortalWrt
