name: 🚀 编译 ImmortalWrt 25 (MT7981 / Cudy TR3000)

on:
  workflow_dispatch:
    inputs:
      multithreading:
        description: '开启多线程编译 (Enable multithreading build)'
        type: boolean
        default: true
      ssh:
        description: '使用 SSH 连接到编译环境 (Connect to the build environment using ssh)'
        type: boolean
        default: false

jobs:
  build:
    if: ${{ inputs.ssh == false }}
    runs-on: ubuntu-latest
    name: 🚀 编译 (Build)
    steps:
      - name: 释放 GitHub Actions 编译空间 (Maximize build space)
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: 下载编译所需的依赖 (Install build dependencies including eBPF/BTF toolchain)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt update
          sudo apt install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache cmake cpio curl device-tree-compiler \
            fastjar flex gawk gettext gcc-multilib g++-multilib git gperf \
            haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full \
            patch pkgconf python3 python3-pyelftools python3-setuptools \
            qemu-utils rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev \
            pahole dwarves libbpf-dev clang llvm linux-tools-common

      - name: 设置 ccache (Setup ccache)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: immortalwrt25-mt7981-v1
          max-size: 2G

      - name: 克隆当前仓库 (Clone config repo)
        uses: actions/checkout@v4

      - name: 克隆 ImmortalWrt 25.xx 仓库 (Clone ImmortalWrt 25.xx)
        uses: actions/checkout@v4
        with:
          repository: 'immortalwrt/immortalwrt'
          ref: 'openwrt-25.12'
          path: ImmortalWrt

      - name: 复制配置文件到 ImmortalWrt (Copy config to ImmortalWrt)
        run: cp -f .config feeds.conf.default diy.sh ImmortalWrt/

      - name: 运行 diy.sh (Run diy.sh)
        working-directory: ImmortalWrt
        run: |
          chmod +x diy.sh
          ./diy.sh

      - name: 更新并下载 feeds (Update feeds)
        working-directory: ImmortalWrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 再次复制 .config (Re-copy .config to override feed defaults)
        run: cp -f .config ImmortalWrt/

      - name: 编译前上传配置 (Upload config before build)
        uses: actions/upload-artifact@v4
        with:
          name: config-before-build
          path: ImmortalWrt/.config

      - name: 多线程编译 ImmortalWrt (Build with multithreading)
        if: ${{ inputs.multithreading == true }}
        working-directory: ImmortalWrt
        run: make -j$(nproc) V=s || make -j1 V=s

      - name: 单线程编译 ImmortalWrt (Build single thread)
        if: ${{ inputs.multithreading == false }}
        working-directory: ImmortalWrt
        run: make -j1 V=s

      - name: 上传编译结果 (Upload firmware artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-Cudy-TR3000
          path: ImmortalWrt/bin/targets/mediatek/mt7981/

  build-ssh:
    if: ${{ inputs.ssh == true }}
    runs-on: ubuntu-latest
    name: 🚀 编译 (Build) - SSH
    steps:
      - name: 释放 GitHub Actions 编译空间 (Maximize build space)
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: 下载编译所需的依赖 (Install build dependencies including eBPF/BTF toolchain)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt update
          sudo apt install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache cmake cpio curl device-tree-compiler \
            fastjar flex gawk gettext gcc-multilib g++-multilib git gperf \
            haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full \
            patch pkgconf python3 python3-pyelftools python3-setuptools \
            qemu-utils rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev \
            pahole dwarves libbpf-dev clang llvm linux-tools-common

      - name: 设置 ccache (Setup ccache)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: immortalwrt25-mt7981-v1
          max-size: 2G

      - name: 克隆当前仓库 (Clone config repo)
        uses: actions/checkout@v4

      - name: 克隆 ImmortalWrt 25.xx 仓库 (Clone ImmortalWrt 25.xx)
        uses: actions/checkout@v4
        with:
          repository: 'immortalwrt/immortalwrt'
          ref: 'openwrt-25.12'
          path: ImmortalWrt

      - name: 复制配置文件到 ImmortalWrt (Copy config to ImmortalWrt)
        run: cp -f .config feeds.conf.default diy.sh ImmortalWrt/

      - name: 运行 diy.sh (Run diy.sh)
        working-directory: ImmortalWrt
        run: |
          chmod +x diy.sh
          ./diy.sh

      - name: 开启 SSH 服务 (Setup SSH)
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 360

      - name: 编译前上传配置 (Upload config)
        uses: actions/upload-artifact@v4
        with:
          name: config-before-build
          path: ImmortalWrt/.config

      - name: 多线程编译 ImmortalWrt (Build with multithreading)
        if: ${{ inputs.multithreading == true }}
        working-directory: ImmortalWrt
        run: make -j$(nproc) V=s || make -j1 V=s

      - name: 单线程编译 ImmortalWrt (Build single thread)
        if: ${{ inputs.multithreading == false }}
        working-directory: ImmortalWrt
        run: make -j1 V=s

      - name: 上传编译结果 (Upload firmware artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-Cudy-TR3000
          path: ImmortalWrt/bin/targets/mediatek/mt7981/
